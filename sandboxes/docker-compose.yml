# Real systems of record for the demo, all running locally. No accounts needed.
#   Odoo 18 Community: Atlas Research's ERP           http://localhost:8069 (admin / admin)
#   Lago:              Lambda's usage billing system   UI http://localhost:8090, API http://localhost:3100
# Start with: npm run sandboxes:up
name: atlas-sandboxes

volumes:
  odoo_db_data:
  odoo_web_data:
  lago_postgres_data:
  lago_redis_data:
  lago_storage_data:

x-lago-image: &lago-image
  image: getlago/api:v1.55.0

x-lago-env: &lago-env
  DATABASE_URL: postgresql://lago:lago@lago-db:5432/lago?search_path=public
  REDIS_URL: redis://lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://lago-redis:6379
  SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE}
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY}
  LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY}
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
  LAGO_USE_AWS_S3: "false"
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_API_URL: http://localhost:3100
  LAGO_FRONT_URL: http://localhost:8090
  LAGO_DISABLE_SEGMENT: "true"
  LAGO_DISABLE_SIGNUP: "true"
  LAGO_SIDEKIQ_WEB: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
  # Creates the "Lambda" organization, a login for its UI, and the API key the app uses.
  LAGO_CREATE_ORG: "true"
  LAGO_ORG_NAME: Lambda
  LAGO_ORG_USER_EMAIL: billing@lambda.example
  LAGO_ORG_USER_PASSWORD: ${LAGO_ORG_USER_PASSWORD}
  LAGO_ORG_API_KEY: ${LAGO_API_KEY}

services:
  odoo-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 20

  odoo:
    image: odoo:18
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    # Creates the "atlas" database with Invoicing installed on first start.
    command: ["-d", "atlas", "-i", "account", "--without-demo=all", "--db-filter=^atlas$$"]
    volumes:
      - odoo_web_data:/var/lib/odoo
    ports:
      - "8069:8069"

  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: lago
      PGDATA: /data/postgres
      POSTGRES_SCHEMA: public
    volumes:
      - lago_postgres_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago -h localhost"]
      interval: 5s
      retries: 20

  lago-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - lago_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  lago-migrate:
    <<: *lago-image
    depends_on:
      lago-db:
        condition: service_healthy
    command: ["./scripts/migrate.sh"]
    environment: *lago-env

  lago-api:
    <<: *lago-image
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.api.sh"]
    environment: *lago-env
    volumes:
      - lago_storage_data:/app/storage
    ports:
      - "3100:3000"
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 5s
      start_period: 30s
      retries: 30

  lago-worker:
    <<: *lago-image
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.worker.sh"]
    environment: *lago-env
    volumes:
      - lago_storage_data:/app/storage

  lago-clock:
    <<: *lago-image
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.clock.sh"]
    environment: *lago-env

  lago-pdf:
    # Upstream Gotenberg (multi-arch). Lago's own image is amd64-only and its Chromium crashes under emulation on Apple Silicon.
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  lago-front:
    image: getlago/front:v1.55.0
    restart: unless-stopped
    depends_on:
      lago-api:
        condition: service_healthy
    environment:
      API_URL: http://localhost:3100
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_PDF_GENERATION: "false"
    ports:
      - "8090:80"
