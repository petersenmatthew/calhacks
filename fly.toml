# fly.toml app configuration file generated for moa-accountants on 2026-10-24T21:05:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moa-accountants'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/moa.db'
  PORT = '3000'
  PUBLIC_DEMO = '1'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
